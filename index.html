<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Apakah Aku Lolos?</title>
        <link rel="stylesheet" href="styles.css" />
        <meta property="og:title" content="Apakah Aku Lolos?" />
        <meta
            property="og:description"
            content="Cek hasil seleksi anggota dengan memasukkan Nama atau ID."
        />
        <meta property="og:url" content="https://aldrinfh1.github.io/daftartugas" />
        <meta property="og:type" content="website" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script src="data.js"></script>
    </head>
    <body>
        <header class="headerori">
            <div class="btn">
                <button class="btn0" onclick="document.location='/'">
                    | aldrinfh1.github.io
                </button>
                
            </div>
        </header>

        <div class="realbody">
            <div class="bgr"></div>
            

            <div class="jdw">
                <form class="search" id="formCari" autocomplete="off">
                    <div>
                <h1 class="h1-apakah">Aku Lolos Nggak Ya?</h1>
            </div>
                    
                    <label for="kueri" id="deskripsi" class="search-label">Masukkan NIM atau Nama Lengkap kamu untuk melihat hasil seleksi.</label>
                    <div class="search-row">
                        <input
                            type="text"
                            id="kueri"
                            class="search-input"
                            placeholder="Contoh: 2026001 atau Nama Lengkap"
                            maxlength="80"
                            required
                        />
                        <button type="submit" class="search-btn" id="tombolCari">
                            Cari
                        </button>
                    </div>
                </form>

                <div id="hasil" class="hasil" aria-live="polite"></div>
            </div>
        </div>

        <footer class="ftr">
            <p class="ftrtext">2026.4.1</p>
        </footer>

        <script>
            const form = document.getElementById("formCari");
            const input = document.getElementById("kueri");
            const tombol = document.getElementById("tombolCari");
            const hasil = document.getElementById("hasil");
            const deskripsi = document.getElementById("deskripsi");
            const TEKS_AWAL = deskripsi.textContent;
            const MIN_HURUF = 3; // panjang minimum pencarian

            // Singkatan/ejaan lain yang disamakan. Tambahkan sendiri jika perlu.
            const SINGKATAN = {
                m: "muhammad", muh: "muhammad", moh: "muhammad", mohd: "muhammad",
                moch: "muhammad", mochammad: "muhammad", mohammad: "muhammad",
                mohamad: "muhammad", muhamad: "muhammad", muhammmad: "muhammad",
            };

            // Huruf kecil, tanpa aksen, tanda baca dibuang ("M." jadi "m", "Asma'ul" jadi "asmaul")
            function normalisasi(teks) {
                return teks
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/['`\u2019]/g, "")
                    .replace(/[^a-z0-9]+/g, " ")
                    .trim();
            }

            // Penyamaan ejaan yang aman: dipakai di data DAN di yang diketik, jadi hasilnya konsisten.
            // "Hassan" dan "Hasan" sama, "Rizky" dan "Rizki" sama, "Wullan" dan "Wulan" sama.
            function samakanEjaan(kata) {
                return kata
                    .replace(/oe/g, "u")
                    .replace(/dj/g, "j")
                    .replace(/tj/g, "c")
                    .replace(/kh/g, "h")
                    .replace(/y/g, "i")
                    .replace(/([a-z])\1+/g, "$1"); // huruf dobel jadi satu (angka tidak diubah)
            }

            // Pecah jadi kata-kata, samakan singkatan (m -> muhammad), lalu samakan ejaan
            function pecah(teks) {
                return normalisasi(teks)
                    .split(" ")
                    .filter(Boolean)
                    .map((t) => samakanEjaan(SINGKATAN[t] || t));
            }

            // Siapkan indeks sekali saja. Field "alias" (array nama lain) bersifat opsional di data.js
            const INDEKS = PESERTA_LOLOS.map((p) => ({
                p,
                id: normalisasi(p.id),
                varian: [p.nama].concat(p.alias || []).map(pecah),
            }));

            // Semua kata yang diketik ada di dalam nama (urutan bebas, boleh sebagian kata)
            function cocokPersis(kataKueri, kataNama) {
                return kataKueri.every((k) => kataNama.some((t) => t.includes(k)));
            }

            function buat(tag, kelas, teks) {
                const el = document.createElement(tag);
                if (kelas) el.className = kelas;
                if (teks !== undefined) el.textContent = teks;
                return el;
            }

            function tampilkanLolos(daftar) {
                hasil.replaceChildren();
                daftar.forEach((p) => {
                    const kartu = buat("div", "kartu lolos");
                    kartu.appendChild(buat("div", "badge badge-lolos", "SELAMAT, KAMU LOLOS"));
                    kartu.appendChild(buat("h2", "kartu-nama", p.nama));

                    const tabel = buat("table", "kartu-tabel");
                    const baris = [["NIM", p.id], ["Status", "Lolos"]];
                    if (p.posisi) baris.push(["Posisi", p.posisi]);
                    if (p.kelas) baris.push(["Kelas", p.kelas]);
                    baris.forEach(([k, v]) => {
                        const tr = document.createElement("tr");
                        tr.appendChild(buat("th", "", k));
                        tr.appendChild(buat("td", "", v));
                        tabel.appendChild(tr);
                    });
                    kartu.appendChild(tabel);
                    hasil.appendChild(kartu);
                });
            }

            function tampilkanTidakLolos(kueri, berupaNIM) {
                hasil.replaceChildren();
                const kartu = buat("div", "kartu tidak");
                kartu.appendChild(buat("div", "badge badge-tidak", "BELUM LOLOS"));
                kartu.appendChild(buat("h2", "kartu-nama", "Jangan putus asa dan tetap semangat!"));

                // Saran disesuaikan dengan apa yang diketik: NIM atau nama
                const saran = berupaNIM
                    ? "Pastikan NIM sudah benar, lalu coba lagi. "
                    : "Pastikan penulisan sudah benar, lalu coba lagi. Jika ragu dengan penulisan nama, cari memakai NIM. ";

                kartu.appendChild(
                    buat(
                        "p",
                        "kartu-ket",
                        "\"" + kueri + "\" tidak ada dalam daftar peserta yang lolos. " +
                        saran +
                        "Jangan putus asa, tetap semangat dan terima kasih sudah mendaftar."
                    )
                );
                hasil.appendChild(kartu);
            }

            function tampilkanPesan(teks) {
                hasil.replaceChildren();
                const kartu = buat("div", "kartu tidak");
                kartu.appendChild(buat("p", "kartu-ket", teks));
                hasil.appendChild(kartu);
            }

            function sudahDibuka() {
                if (!KONFIG.bukaPada) return true;
                return Date.now() >= new Date(KONFIG.bukaPada).getTime();
            }

            function kunciSampaiWaktunya() {
                const waktu = new Date(KONFIG.bukaPada).toLocaleString("id-ID", {
                    dateStyle: "full",
                    timeStyle: "short",
                });
                deskripsi.textContent = "Pengumuman dibuka pada " + waktu + " (waktu perangkatmu).";
                input.disabled = true;
                tombol.disabled = true;

                const timer = setInterval(() => {
                    if (sudahDibuka()) {
                        clearInterval(timer);
                        deskripsi.textContent = TEKS_AWAL;
                        input.disabled = false;
                        tombol.disabled = false;
                    }
                }, 1000);
            }

            function cari(mentah) {
                if (!sudahDibuka()) return;

                mentah = mentah.trim();
                const kueri = normalisasi(mentah);
                if (!kueri) return;

                // Terlalu pendek ditolak agar tidak menampilkan banyak orang sekaligus
                if (kueri.replace(/ /g, "").length < MIN_HURUF) {
                    tampilkanPesan("Ketik minimal " + MIN_HURUF + " karakter dari Nama atau NIM kamu.");
                    return;
                }

                const kata = pecah(mentah);
                
                // NIM persis, atau semua kata yang diketik cocok dengan nama/alias
                const ketemu = INDEKS.filter(
                    (x) => x.id === kueri || x.varian.some((v) => cocokPersis(kata, v))
                );
                if (ketemu.length) {
                    tampilkanLolos(ketemu.map((x) => x.p));
                    return;
                }

                tampilkanTidakLolos(mentah, /^\d+$/.test(kueri));
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                cari(input.value);
            });

            if (!sudahDibuka()) kunciSampaiWaktunya();
        </script>
    </body>
</html>
